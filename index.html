    <script>
      // Pasang tema yang tersimpan sebelum halaman tergambar, agar mode gelap
      // tidak berkedip putih saat dibuka. Bawaan: tema terang.
      try {
        if (localStorage.getItem('caliak-tema') === 'gelap') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>

    <div id="root"></div>
